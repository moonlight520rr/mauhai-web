<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毛孩站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#2b2722; --muted:#5c564e; --line:#e6e1d8;
    --home:#e25a32; --home-bg:#fff4ee;
    --vet:#0b88a8; --vet-bg:#eef9fb;
    --med:#3f4db8; --med-bg:#eef0fb;
    --diet:#d4860a; --diet-bg:#fff8e8;
    --board:#e23d68; --board-bg:#fff1f4;
    --calc:#4d5ed6; --calc-bg:#f3f4ff;
    --prod:#c43b78; --prod-bg:#fdf3f8;
    --svc:#0f8f78; --svc-bg:#eefaf7;
    --plant:#5a9a1c; --plant-bg:#f4fbe8;
    --all:#7a4fd0; --all-bg:#f6f2ff;
    --set:#5c564e; --set-bg:#f6f4f1;
    --veil:rgba(243,240,234,.55);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    font-family:"Noto Sans TC","PingFang HK","PingFang TC",sans-serif;
    font-weight:400; line-height:1.65; color:var(--ink);
    background:#f3f0ea;
  }
  button, input, select { font:inherit; }
  #app { min-height:100%; position:relative; }
  .stage {
    min-height:100dvh;
    background:#f3f0ea center/cover fixed no-repeat;
    padding: calc(16px + env(safe-area-inset-top)) 16px 108px;
  }
  .stage::before {
    content:""; position:fixed; inset:0; background:var(--veil); pointer-events:none;
  }
  .col { max-width:512px; margin:0 auto; position:relative; z-index:1; }
  h1 { font-size:24px; font-weight:500; letter-spacing:.02em; line-height:1.35; margin:0; }
  .sub { color:var(--muted); font-size:14px; margin:6px 0 14px; }
  .card {
    background:rgba(255,255,255,.8); backdrop-filter:blur(16px);
    border-radius:24px; padding:16px; box-shadow:0 8px 24px rgba(40,30,20,.06);
    margin:0 0 12px;
  }
  .row { display:flex; gap:10px; align-items:center; }
  .search, .field {
    width:100%; height:44px; border-radius:12px; border:1px solid var(--line);
    padding:0 12px; font-size:16px; background:#fff;
  }
  .field:focus, .search:focus { outline:none; border-color:var(--accent); }
  .chips { display:flex; gap:8px; overflow:auto; padding:8px 0 12px; }
  .chip {
    height:44px; border-radius:999px; border:0; padding:0 12px; white-space:nowrap;
    background:color-mix(in srgb, var(--accent) 12%, white); color:var(--accent); font-size:13px; font-weight:500;
  }
  .chip.on { background:var(--accent); color:#fff; }
  .btn {
    height:52px; border:0; border-radius:18px; background:var(--accent); color:#fff;
    font-size:16px; font-weight:500; width:100%;
  }
  .btn.ghost { background:#fff; color:var(--accent); border:1px solid var(--line); }
  .mark {
    width:52px; height:52px; border-radius:16px; background:var(--accent); color:#fff;
    display:grid; place-items:center; font-size:24px; flex:none;
  }
  .dock {
    position:fixed; left:16px; right:16px; bottom:calc(12px + env(safe-area-inset-bottom));
    max-width:512px; margin:0 auto; z-index:20;
    display:flex; gap:4px; padding:8px; border-radius:22px;
    background:rgba(255,255,255,.8); backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.7); box-shadow:0 10px 30px rgba(40,30,20,.12);
  }
  .dock button {
    flex:1; min-height:40px; border:0; background:transparent; color:var(--muted);
    font-size:11px; font-weight:500; border-radius:16px;
  }
  .dock button .ic {
    width:28px; height:28px; border-radius:50%; margin:0 auto 2px;
    display:grid; place-items:center; font-size:14px;
  }
  .dock button.on .ic { background:var(--accent); color:#fff; }
  .sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:#fff; border-radius:24px 24px 0 0; padding:10px 16px 28px;
    max-height:38dvh; box-shadow:0 -12px 40px rgba(0,0,0,.12);
  }
  .handle { width:36px; height:6px; border-radius:99px; background:#ddd; margin:4px auto 12px; }
  .sheet h3 { margin:8px 0 6px; font-size:12px; color:var(--muted); font-weight:500; }
  .sheet button {
    width:100%; height:56px; border:0; border-radius:16px; background:#f6f4f1;
    text-align:left; padding:0 14px; margin:0 0 8px; font-size:12px;
  }
  .vet {
    border-radius:24px; overflow:hidden; min-height:176px; margin:0 0 12px;
    background:#122028 center/cover no-repeat; color:#fff; position:relative;
  }
  .vet .bar {
    position:absolute; left:0; right:0; bottom:0; padding:12px 14px;
    background:rgba(18,32,40,.72);
  }
  .vet .dist { font-size:14px; opacity:.85; }
  .vet .nm { font-size:16px; font-weight:500; }
  .vet .st { font-size:12px; }
  .top {
    position:fixed; right:18px; bottom:92px; z-index:15; height:44px; border:0;
    border-radius:999px; color:#fff; background:var(--accent); padding:0 16px;
  }
  .banner {
    font-size:12px; color:#9a6b12; background:#fff8e8; border-radius:16px; padding:10px 12px; margin:0 0 12px;
  }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .plant {
    background:rgba(255,255,255,.88); border-radius:18px; padding:12px; min-height:88px;
  }
  .tag { display:inline-block; border-radius:999px; font-size:11px; padding:2px 8px; background:#eee; }
  .big { font-size:36px; font-weight:500; line-height:1.1; }
  .hide { display:none; }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script>
const PAGES = {
  home: { title:'毛孩站', accent:'#e25a32', bg:'bg/home.jpg', tint:'#fff4ee' },
  vets: { title:'診所', accent:'#0b88a8', bg:'bg/vets.jpg', tint:'#eef9fb' },
  meds: { title:'藥物庫', accent:'#3f4db8', bg:'bg/meds.jpg', tint:'#eef0fb' },
  diets:{ title:'處方糧', accent:'#d4860a', bg:'bg/diets.jpg', tint:'#fff8e8' },
  board:{ title:'毛孩討論', accent:'#e23d68', bg:'bg/board.jpg', tint:'#fff1f4' },
  calc: { title:'卡路里同飲水', accent:'#4d5ed6', bg:'bg/calc.jpg', tint:'#f3f4ff' },
  products:{ title:'產品', accent:'#c43b78', bg:'bg/products.jpg', tint:'#fdf3f8' },
  services:{ title:'毛孩服務', accent:'#0f8f78', bg:'bg/services.jpg', tint:'#eefaf7' },
  plants:{ title:'植物', accent:'#5a9a1c', bg:'bg/plants.jpg', tint:'#f4fbe8' },
  allergies:{ title:'過敏', accent:'#7a4fd0', bg:'bg/allergies.jpg', tint:'#f6f2ff' },
  animals:{ title:'動物檔案', accent:'#e25a32', bg:'bg/animals.jpg', tint:'#fff4ee' },
  settings:{ title:'設定', accent:'#5c564e', bg:'bg/settings.jpg', tint:'#f6f4f1' },
  login:{ title:'登入', accent:'#e23d68', bg:'bg/login.jpg', tint:'#fff1f4' }
};
const MEDS = [
  ['大寵愛','心絲蟲／跳蚤／疥蟎預防','貓狗'],
  ['革命','心絲蟲／跳蚤','貓狗'],
  ['心絲蟲藥','預防','狗'],
  ['抗生素（須獸醫）','感染','貓狗'],
  ['止痛（須獸醫）','痛症','貓狗']
];
const DIETS = ['rc-renal-cat','rc-urinary-s-o-cat','hills-kd-cat','hills-id-cat','hills-zd-cat','rc-gi','rc-hypo','purina-nf','vl-renal','hills-gi-biome-cat'];
const PLANTS = [
  ['百合','致命','貓'], ['蘇鐵','致命','狗'], ['夾竹桃','致命','貓狗'],
  ['朱古力','嚴重','狗'], ['葡萄','嚴重','狗'], ['洋蔥','嚴重','貓狗'],
  ['木糖醇','致命','狗'], ['金針／萱草','嚴重','貓']
];
const ALLERGIES = [
  ['雞','常見蛋白'], ['牛','常見蛋白'], ['魚','常見蛋白'],
  ['禾草','環境'], ['塵蟎','環境'], ['跳蚤','寄生']
];
const state = {
  page: location.hash.replace('#','') || 'home',
  more: false,
  q: '',
  chip: '全部',
  openId: null,
  top: false
};
function pets() { try { return JSON.parse(localStorage.getItem('mh-pets')||'[]'); } catch { return []; } }
function savePets(list) { localStorage.setItem('mh-pets', JSON.stringify(list)); }
function go(page) { state.page = page; state.more = false; state.openId = null; location.hash = page; render(); }
function render() {
  const meta = PAGES[state.page] || PAGES.home;
  const clinics = (window.MAUHAI && MAUHAI.clinics) || [];
  const vets = (window.MAUHAI && MAUHAI.vets) || [];
  document.documentElement.style.setProperty('--accent', meta.accent);
  const body = pageBody(meta, clinics, vets);
  document.getElementById('app').innerHTML = `
    <div class="stage" style="background-image:linear-gradient(${meta.tint},${meta.tint}),url('${meta.bg}')">
      <div class="col">${body}</div>
    </div>
    ${state.page === 'vets' ? '' : `<button class="top ${state.top?'':'hide'}" onclick="window.scrollTo({top:0,behavior:'smooth'})">最上</button>`}
    ${dock()}
    ${state.more ? sheet() : ''}`;
}
function pageBody(meta, clinics, vets) {
  if (state.page === 'home') return home();
  if (state.page === 'vets') return vetsPage(clinics);
  if (state.page === 'meds') return listPage('藥物庫', '藥丸', MEDS.map(m => `<div class="card"><b>${m[0]}</b><div class="sub">${m[1]} · ${m[2]}</div></div>`).join(''), MEDS.length);
  if (state.page === 'diets') return listPage('處方糧', '碗', DIETS.map(id => `<div class="card"><b>${id}</b><div class="sub">處方糧編號，跟專案相片 id</div></div>`).join(''), DIETS.length);
  if (state.page === 'board') return `<div class="row"><span style="font-size:20px">爪</span><h1>毛孩討論</h1></div><div class="card">討論區帖子要雲端帳戶。而家可以開到呢一頁，發帖會喺登入後先做。</div><button class="btn" onclick="go('login')">登入先開Post</button>`;
  if (state.page === 'calc') return calc();
  if (state.page === 'products') return listPage('產品', '盒', '<div class="sub">香港常見預防產品</div>' + MEDS.slice(0,3).map(m => `<div class="card"><b>${m[0]}</b><div class="sub">${m[1]}</div></div>`).join(''), 3);
  if (state.page === 'services') return `<div class="sub">毛孩服務</div><h1>保險 · 善終 · 氧氣 · 支援</h1><div class="chips">${['保險','善終','氧氣','支援'].map(x=>`<button class="chip ${state.chip===x?'on':''}" onclick="state.chip='${x}';render()">${x}</button>`).join('')}</div><div class="card">呢一頁跟服務分頁。詳細公司名單喺上次完整網站，今次先還原到開得到嘅殼同診所目錄。</div>`;
  if (state.page === 'plants') return plants(PLANTS, '植物', '葉');
  if (state.page === 'allergies') return plants(ALLERGIES, '過敏', '風');
  if (state.page === 'animals') return animals();
  if (state.page === 'settings') return settings();
  if (state.page === 'login') return login();
  return home();
}
function home() {
  const list = pets();
  if (!list.length) {
    return `<div class="row"><div class="mark">毛</div><h1 style="font-size:28px;margin-left:10px">毛孩站</h1></div>
      <p class="sub">個人離線卡路里、飲水同藥物參考。呢個係由專案殘檔還原嘅網頁，可以再開到。</p>
      <button class="btn" onclick="go('vets')">搵夜晚急症</button>
      <div style="height:10px"></div>
      <button class="btn ghost" onclick="go('animals')">新增第一隻毛孩</button>
      <div class="card" style="margin-top:14px"><b>助手</b><div class="sub">本機先搜診所同獸醫名冊。伺服器助手要 mauhai.hk 重新解析先叫到。</div></div>`;
  }
  const p = list[0];
  return `<h1 style="font-size:32px">${p.name}</h1><div class="sub">${p.species} · ${p.kg} kg</div>
    <div class="card"><div class="big">${Math.round(p.kg*70)}</div><div class="sub">大約每日卡路里起點，唔係處方</div></div>
    <button class="btn" onclick="go('calc')">計卡路里同飲水</button>`;
}
function vetsPage(clinics) {
  const chips = ['全部','急症','24小時','未結業'];
  const q = state.q.trim();
  let rows = clinics.filter(c => {
    if (state.chip === '急症' && !c.emergency) return false;
    if (state.chip === '24小時' && !c.hours24) return false;
    if (state.chip === '未結業' && c.closed) return false;
    if (!q) return true;
    return (c.name+c.en+c.district+c.address).includes(q);
  });
  return `<div class="row"><span>針</span><h1>診所</h1></div>
    <input class="search" placeholder="搜尋診所、地區" value="${esc(state.q)}" oninput="state.q=this.value;render()">
    <div class="chips">${chips.map(c=>`<button class="chip ${state.chip===c?'on':''}" onclick="state.chip='${c}';render()">${c}</button>`).join('')}</div>
    <div class="sub">${rows.length} 間 · 目錄來自專案 Catalog.json</div>
    ${rows.slice(0,80).map(c => `
      <article class="vet" onclick="state.openId=state.openId==='${c.id}'?null:'${c.id}';render()">
        <div class="bar">
          <div class="dist">${esc(c.district)} · ${c.closed?'已結業':(c.hours24?'24小時':esc(c.hours||'見店內'))}</div>
          <div class="nm">${esc(c.name)}</div>
          <div class="st">${c.emergency?'急症':''} ${esc(c.animals)}</div>
          ${state.openId===c.id ? `<div class="st">${esc(c.address)}<br>${esc(c.phone)}<br>${esc(c.services)}</div>` : ''}
        </div>
      </article>`).join('')}`;
}
function listPage(title, icon, html, n) {
  return `<div class="row"><span>${icon}</span><h1>${title}</h1></div><div class="sub">${n} 項</div>${html}`;
}
function plants(items, title, icon) {
  return `<div class="row"><span>${icon}</span><h1>${title}</h1></div>
    <p class="sub">誤食可能致命。帶同食咗咩、幾多、幾時，唔好自己催吐。</p>
    <div class="grid2">${items.map(x=>`<div class="plant"><span class="tag">${esc(x[1])}</span><div>${esc(x[0])}</div><div class="sub">${esc(x[2])}</div></div>`).join('')}</div>`;
}
function calc() {
  return `<h1>卡路里同飲水</h1><p class="sub">只係起點，唔係獸醫處方。</p>
    <div class="card">
      <div class="row"><input class="field" id="kg" type="number" min="0.2" step="0.1" placeholder="體重 kg" value="4">
      <select class="field" id="sp"><option>貓</option><option>狗</option></select></div>
      <div style="height:10px"></div>
      <button class="btn" onclick="calcNow()">計算</button>
      <div id="calcOut" class="big" style="margin-top:12px"></div>
    </div>`;
}
function calcNow() {
  const kg = Number(document.getElementById('kg').value)||0;
  const rer = 70 * Math.pow(kg, 0.75);
  const water = kg * 50;
  document.getElementById('calcOut').textContent = `${Math.round(rer)} kcal · ${Math.round(water)} ml 水`;
}
function animals() {
  const list = pets();
  return `<div class="row"><h1>動物檔案</h1><button class="chip on" onclick="addPet()">新增</button></div>
    ${list.length? list.map(p=>`<div class="card"><b>${esc(p.name)}</b><div class="sub">${esc(p.species)} · ${p.kg} kg</div></div>`).join('') : `<div class="card" style="text-align:center"><div class="mark" style="margin:0 auto 8px">爪</div><div class="sub">未有毛孩</div></div>`}`;
}
function addPet() {
  const name = prompt('毛孩名'); if (!name) return;
  const species = prompt('物種','貓') || '貓';
  const kg = Number(prompt('體重 kg','4')) || 4;
  const list = pets(); list.push({name, species, kg}); savePets(list); go('home');
}
function settings() {
  return `<div class="card" style="background:var(--accent);color:#fff;border-radius:32px">
      <div class="mark" style="background:#fff;color:var(--accent)">人</div>
      <h1 style="color:#fff;margin-top:8px">毛孩主人</h1>
      <div>未登入</div>
      <button class="btn ghost" onclick="go('login')">登入</button>
    </div>
    <div class="card">字體 Noto Sans TC。底欄五項。網頁同 iOS zip 一齊留低。</div>`;
}
function login() {
  return `<div class="sub">毛孩站</div><h1 style="font-size:30px">登入</h1>
    <div class="card">
      <input class="field" placeholder="電郵" style="height:48px;border-radius:16px">
      <div style="height:8px"></div>
      <input class="field" type="password" placeholder="密碼" style="height:48px;border-radius:16px">
      <div style="height:8px"></div>
      <input class="field" placeholder="+852 電話" style="height:48px;border-radius:16px">
      <div style="height:12px"></div>
      <button class="btn" onclick="alert('雲端登入要伺服器。而家只保留畫面。')">登入</button>
    </div>`;
}
function dock() {
  const items = [['home','主頁','家'],['vets','診所','針'],['meds','藥物','藥'],['diets','處方糧','碗'],['more','更多','…']];
  return `<nav class="dock">${items.map(([id,label,ic]) => {
    const on = id==='more' ? state.more : state.page===id;
    return `<button class="${on?'on':''}" onclick="${id==='more'?'state.more=!state.more;render()':`go('${id}')`}"><div class="ic">${ic}</div>${label}</button>`;
  }).join('')}</nav>`;
}
function sheet() {
  const item = (id, label) => `<button onclick="go('${id}')">${label}</button>`;
  return `<div class="sheet" onclick="event.stopPropagation()">
    <div class="handle"></div>
    <h3>日常</h3>${item('calc','計算')}${item('products','產品')}${item('board','討論')}
    <h3>參考</h3>${item('services','服務')}${item('plants','植物')}${item('allergies','過敏')}
    <h3>最後</h3>${item('settings','設定')}${item('animals','動物檔案')}
  </div>`;
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }
addEventListener('hashchange', () => { state.page = location.hash.replace('#','') || 'home'; render(); });
addEventListener('scroll', () => { const show = scrollY > 240 && state.page !== 'vets'; if (show!==state.top){ state.top=show; const b=document.querySelector('.top'); if(b) b.classList.toggle('hide', !show);} });
render();
</script>
</body>
</html>
